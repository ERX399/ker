<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Viewer</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d;
  --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
  --code-bg: #1c2128; --th-bg: #21262d;
  --blockquote-bd: #58a6ff; --tag-bg: #1b1f23;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
.light {
  --bg: #ffffff; --card: #f6f8fa; --border: #d0d7de;
  --text: #1f2328; --muted: #656d76; --accent: #0969da;
  --code-bg: #f0f2f4; --th-bg: #e7e9ec;
  --blockquote-bd: #0969da; --tag-bg: #eaeef2;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  min-height:100vh; transition: background .3s, color .3s;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
}
/* toolbar */
.toolbar {
  position:sticky; top:0; z-index:100;
  background:var(--card); border-bottom:1px solid var(--border);
  padding:8px 16px; display:flex; align-items:center; gap:8px;
  min-height:44px; user-select:none; -webkit-user-select:none;
}
.toolbar .title {
  font-size:13px; font-weight:600; color:var(--text);
  white-space:nowrap; letter-spacing:.02em;
}
.toolbar .file-info {
  font-size:12px; color:var(--muted); max-width:240px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  flex:1; min-width:0;
}
.toolbar-right { display:flex; align-items:center; gap:6px; margin-left:auto; }
.btn {
  padding:5px 12px; border-radius:4px; font-size:12px; cursor:pointer;
  border:1px solid var(--border); background:var(--card); color:var(--text);
  transition: background .15s; white-space:nowrap;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { background:var(--th-bg); }
.btn-accent { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:500; }
.btn-accent:hover { opacity:.85; }
.btn-group { display:flex; gap:0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.btn-group::-webkit-scrollbar { display:none; }
.btn-group .btn { border-radius:0; margin-left:-1px; flex-shrink:0; }
.btn-group .btn:first-child { border-radius:4px 0 0 4px; }
.btn-group .btn:last-child { border-radius:0 4px 4px 0; }

/* content */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:calc(100vh - 44px); color:var(--muted); gap:12px;
  padding:24px;
}
.empty-state .icon { opacity:.35; margin-bottom:4px; }
.empty-state p { font-size:14px; font-weight:500; }
.empty-state .hint { font-size:12px; opacity:.55; }
.md-body {
  max-width:860px; margin:0 auto; padding:24px 20px 64px;
  line-height:1.75; font-size:15px;
  -webkit-text-size-adjust: 100%;
}
/* md styles */
.md-body h1 { font-size:1.75em; border-bottom:1px solid var(--border); padding-bottom:.25em; margin:28px 0 14px; font-weight:600; }
.md-body h2 { font-size:1.35em; border-bottom:1px solid var(--border); padding-bottom:.2em; margin:24px 0 12px; font-weight:600; }
.md-body h3 { font-size:1.15em; margin:20px 0 10px; font-weight:600; }
.md-body h4 { font-size:1.05em; margin:16px 0 8px; font-weight:600; }
.md-body p { margin:0 0 12px; }
.md-body a { color:var(--accent); text-decoration:none; }
.md-body a:hover { text-decoration:underline; }
.md-body blockquote {
  border-left:3px solid var(--blockquote-bd); padding:6px 14px;
  margin:12px 0; color:var(--muted); font-size:.95em;
}
.md-body code {
  background:var(--code-bg); padding:1.5px 5px; border-radius:3px;
  font-family:'SF Mono',Consolas,monospace; font-size:.88em;
}
.md-body pre {
  background:var(--code-bg); padding:14px; border-radius:6px;
  overflow-x:auto; margin:12px 0; border:1px solid var(--border);
  line-height:1.5; -webkit-overflow-scrolling:touch;
}
.md-body pre code { background:none; padding:0; font-size:.85em; }
.md-body table { border-collapse:collapse; width:100%; margin:12px 0; font-size:.9em; display:block; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.md-body th, .md-body td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
.md-body th { background:var(--th-bg); font-weight:600; font-size:.88em; }
.md-body tr:nth-child(even) { background:var(--card); }
.md-body ul, .md-body ol { padding-left:1.6em; margin:6px 0 12px; }
.md-body li { margin:2px 0; }
.md-body hr { border:none; border-top:1px solid var(--border); margin:20px 0; }
.md-body img { max-width:100%; border-radius:4px; }
.md-body strong { font-weight:600; }
/* input file hidden */
#fileInput { display:none; }
/* mobile */
@media (max-width:600px) {
  .toolbar { padding:6px 10px; gap:4px; }
  .toolbar .title { font-size:12px; }
  .md-body { padding:16px 12px 48px; font-size:14px; }
  .md-body h1 { font-size:1.4em; }
  .md-body h2 { font-size:1.15em; }
}
</style>
</head>
<body>

<div class="toolbar">
  <span class="title">MD Viewer</span>
  <span class="file-info" id="fileInfo">未打开文件</span>
  <div class="toolbar-right">
    <div class="btn-group" id="tabGroup" style="display:none;"></div>
    <label for="fileInput" class="btn btn-accent" id="pickBtn">打开</label>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt,.text" multiple onclick="this.value=null">
    <button class="btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">◐</button>
  </div>
</div>

<div id="empty" class="empty-state">
  <span class="icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></span>
  <p>打开 Markdown 文件开始阅读</p>
  <p class="hint">拖拽文件 · 点击按钮 · Ctrl+O</p>
</div>
<div id="content" class="md-body" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// === marked config ===
if (typeof marked !== 'undefined') {
  marked.setOptions({ breaks:true, gfm:true });
}

// === state ===
let tabs = [];
let activeIdx = -1;
const $empty = document.getElementById('empty');
const $content = document.getElementById('content');
const $fileInfo = document.getElementById('fileInfo');
const $tabGroup = document.getElementById('tabGroup');
const $fileInput = document.getElementById('fileInput');
const $themeBtn = document.getElementById('themeBtn');

// === theme ===
function toggleTheme() {
  document.body.classList.toggle('light');
  $themeBtn.textContent = document.body.classList.contains('light') ? '◑' : '◐';
  localStorage.setItem('md_viewer_theme', document.body.classList.contains('light') ? 'light' : 'dark');
}
(function loadTheme() {
  if (localStorage.getItem('md_viewer_theme') === 'light') {
    document.body.classList.add('light');
    $themeBtn.textContent = '◑';
  }
})();

// === file reading ===
function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, content: reader.result });
    reader.onerror = reject;
    reader.readAsText(file, 'UTF-8');
  });
}

function getShortName(name, maxLen = 28) {
  return name.length > maxLen ? name.slice(0, maxLen - 3) + '...' : name;
}

// === tab management ===
function renderTabs() {
  $tabGroup.innerHTML = tabs.map((t, i) =>
    `<button class="btn${i === activeIdx ? ' btn-accent' : ''}" onclick="switchTab(${i})">${getShortName(t.name)}</button>`
  ).join('');
  $tabGroup.style.display = tabs.length > 1 ? 'flex' : 'none';
}

function switchTab(idx) {
  activeIdx = idx;
  renderContent();
  renderTabs();
}

function removeTab(idx) {
  tabs.splice(idx, 1);
  if (tabs.length === 0) { activeIdx = -1; showEmpty(); return; }
  if (activeIdx >= tabs.length) activeIdx = tabs.length - 1;
  if (activeIdx < 0) activeIdx = 0;
  renderContent();
  renderTabs();
  $fileInfo.textContent = `${tabs.length} 个文件`;
}

function showEmpty() {
  $empty.style.display = 'flex';
  $content.style.display = 'none';
  $fileInfo.textContent = '未打开文件';
  $tabGroup.style.display = 'none';
}

function renderContent() {
  if (activeIdx < 0 || tabs.length === 0) { showEmpty(); return; }
  $empty.style.display = 'none';
  $content.style.display = 'block';
  const t = tabs[activeIdx];
  const html = typeof marked !== 'undefined'
    ? marked.parse(t.content)
    : '<pre>' + escapeHtml(t.content) + '</pre>';
  $content.innerHTML = html;
  $fileInfo.textContent = getShortName(t.name, 40);
}

function escapeHtml(str) {
  return str.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
}

// === add files ===
async function addFiles(fileList, replaceCurrent = false) {
  const files = Array.from(fileList).filter(f =>
    f.name.match(/\.(md|markdown|txt|text)$/i) || f.type === 'text/plain' || f.type === ''
  );
  if (files.length === 0) { alert('未找到支持的 .md 文件'); return; }
  const results = await Promise.all(files.map(readFile));
  if (replaceCurrent && tabs.length > 0 && activeIdx >= 0) {
    tabs[activeIdx] = results[0];
    for (let i = 1; i < results.length; i++) tabs.push(results[i]);
  } else {
    results.forEach(r => tabs.push(r));
    activeIdx = tabs.length - 1;
  }
  $fileInfo.textContent = `${tabs.length} 个文件`;
  renderContent();
  renderTabs();
}

// === events ===
$fileInput.addEventListener('change', () => {
  if ($fileInput.files.length > 0) addFiles($fileInput.files, true);
});

document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files.length > 0) addFiles(e.dataTransfer.files);
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
    e.preventDefault(); $fileInput.click();
  }
  if (e.ctrlKey && e.key === 'w' && tabs.length > 0 && activeIdx >= 0) {
    e.preventDefault(); removeTab(activeIdx);
  }
});
</script>
</body>
</html>
