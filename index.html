<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="darkreader-lock">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KER 音乐</title>
    <style>
        :root {
            color-scheme: dark;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            color-scheme: dark;
        }
        h1 { font-size: 1.5em; margin-bottom: 4px; }
        .subtitle { font-size: 0.85em; color: #888; margin-bottom: 16px; }
        .status { padding: 12px; border-radius: 8px; margin-bottom: 16px; background: #1a1a1a; }
        .song-list { display: flex; flex-direction: column; gap: 8px; }
        .song-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; background: #1a1a1a; border-radius: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        .song-item:hover { background: #2a2a2a; }
        .song-item.playing { background: #1e3a1e; border: 1px solid #3a3; }
        .song-num { color: #888; min-width: 28px; text-align: right; }
        .song-name { flex: 1; }
        .play-icon { color: #3a3; min-width: 20px; text-align: center; }
        .error { color: #f55; }
        .controls { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
        button {
            padding: 10px 18px; border: none; border-radius: 6px;
            background: #2a2a2a; color: #eee; cursor: pointer;
            font-size: 0.95em;
        }
        button:hover { background: #3a3a3a; }
        button.active { background: #3a3; color: #000; }
        audio { width: 100%; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>🎵 KER 音乐</h1>
    <p class="subtitle" id="songCount">--</p>
    <div class="status" id="status">⏳ 正在加载 music.js...</div>
    <div class="song-list" id="songList"></div>
    <audio id="audio" controls></audio>
    <div class="controls">
        <button onclick="prev()">⏮ 上一首</button>
        <button onclick="togglePlay()" id="btnPlay">▶ 播放</button>
        <button onclick="next()">⏭ 下一首</button>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/ERX399/ker@main/music.js"></script>
    <script>
        const status = document.getElementById('status');
        const songList = document.getElementById('songList');
        const songCount = document.getElementById('songCount');
        const audio = document.getElementById('audio');
        const btnPlay = document.getElementById('btnPlay');
        let currentIndex = -1;
        let songs = [];

        function init() {
            if (typeof KER_MUSIC === 'undefined') {
                status.innerHTML = '❌ <span class="error">music.js 加载失败！无法获取歌曲列表。</span>';
                return;
            }
            songs = KER_MUSIC.songs || [];
            if (songs.length === 0) {
                status.innerHTML = '⚠️ 歌曲列表为空，请检查音乐文件是否已部署。';
                return;
            }
            status.innerHTML = '✅ 成功加载 ' + songs.length + ' 首歌曲';
            songCount.textContent = '共 ' + songs.length + ' 首歌曲';
            renderSongList();
        }

        function renderSongList() {
            songList.innerHTML = '';
            songs.forEach(function(song, i) {
                var div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = '<span class="song-num">' + (i + 1) + '</span>' +
                    '<span class="song-name">' + song.name + '</span>' +
                    '<span class="play-icon">▶</span>';
                div.addEventListener('click', (function(idx) { return function() { playIndex(idx); }; })(i));
                songList.appendChild(div);
            });
        }

        function playIndex(i) {
            if (i < 0 || i >= songs.length) return;
            currentIndex = i;
            var song = songs[i];
            audio.src = song.url;
            audio.play().catch(function(e) {
                status.innerHTML = '❌ <span class="error">播放失败：' + song.name + ' — ' + e.message + '</span>';
            });
            updateUI();
        }

        function updateUI() {
            document.querySelectorAll('.song-item').forEach(function(el, i) {
                if (i === currentIndex) {
                    el.classList.add('playing');
                } else {
                    el.classList.remove('playing');
                }
            });
            btnPlay.textContent = audio.paused ? '▶ 播放' : '⏸ 暂停';
        }

        function togglePlay() {
            if (currentIndex === -1) { playIndex(0); return; }
            if (audio.paused) audio.play(); else audio.pause();
            updateUI();
        }

        function next() { playIndex((currentIndex + 1) % songs.length); }
        function prev() { playIndex((currentIndex - 1 + songs.length) % songs.length); }

        audio.addEventListener('play', updateUI);
        audio.addEventListener('pause', updateUI);
        audio.addEventListener('error', function() {
            status.innerHTML = '❌ <span class="error">音频加载失败，请检查音乐文件是否可访问</span>';
        });

        init();
    </script>
</body>
</html>
