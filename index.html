<!DOCTYPE html>

    <style>
        :root {

        body {

        button {
            padding: 10px 18px; border: none; border-radius: 6px;

            font-size: 0.95em;
        }
        button:hover { background: #3a3a3a; }
        button.active { background: #3a3; color: #000; }
        audio { width: 100%; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>ðŸŽµ KER éŸ³ä¹</h1>
    <p class="subtitle" id="songCount">--</p>
    <div class="status" id="status">â³ æ­£åœ¨åŠ è½½ music.js...</div>
    <div class="song-list" id="songList"></div>
    <audio id="audio" controls></audio>
    <div class="controls">
        <button onclick="prev()">â® ä¸Šä¸€é¦–</button>
        <button onclick="togglePlay()" id="btnPlay">â–¶ æ’­æ”¾</button>
        <button onclick="next()">â­ ä¸‹ä¸€é¦–</button>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/ERX399/ker@main/music.js"></script>
    <script>
        const status = document.getElementById('status');
        const songList = document.getElementById('songList');
        const songCount = document.getElementById('songCount');
        const audio = document.getElementById('audio');
        const btnPlay = document.getElementById('btnPlay');
        let currentIndex = -1;
        let songs = [];

        function init() {
            if (typeof KER_MUSIC === 'undefined') {
                status.innerHTML = 'âŒ <span class="error">music.js åŠ è½½å¤±è´¥ï¼æ— æ³•èŽ·å–æ­Œæ›²åˆ—è¡¨ã€‚</span>';
                return;
            }
            songs = KER_MUSIC.songs || [];
            if (songs.length === 0) {
                status.innerHTML = 'âš ï¸ æ­Œæ›²åˆ—è¡¨ä¸ºç©ºï¼Œè¯·æ£€æŸ¥éŸ³ä¹æ–‡ä»¶æ˜¯å¦å·²éƒ¨ç½²ã€‚';
                return;
            }
            status.innerHTML = 'âœ… æˆåŠŸåŠ è½½ ' + songs.length + ' é¦–æ­Œæ›²';
            songCount.textContent = 'å…± ' + songs.length + ' é¦–æ­Œæ›²';
            renderSongList();
        }

        function renderSongList() {
            songList.innerHTML = '';
            songs.forEach(function(song, i) {
                var div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = '<span class="song-num">' + (i + 1) + '</span>' +
                    '<span class="song-name">' + song.name + '</span>' +
                    '<span class="play-icon">â–¶</span>';
                div.addEventListener('click', (function(idx) { return function() { playIndex(idx); }; })(i));
                songList.appendChild(div);
            });
        }

        function playIndex(i) {
        if (i < 0 || i >= songs.length) return;
        currentIndex = i;
        var song = songs[i];
        // å…ˆå½»åº•ä¸­æ–­ä¸Šä¸€é¦–æ’­æ”¾ï¼Œé¿å… 'The play() request was interrupted' é”™è¯¯
        try {
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
        } catch(e) {}
        audio.src = song.url;
        audio.load();
        var playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(function() {
                // æ’­æ”¾æˆåŠŸ
            }).catch(function(e) {
                if (e.name === 'AbortError') {
                    // ç”¨æˆ·å¿«é€Ÿåˆ‡æ¢æ—¶è¢«ä¸­æ–­ï¼Œe¿½æ•¥è¿™ä¸ªé”™è¯¯
                    return;
                }
                status.innerHTML = 'âŒ <span class="error">æ’­æ”¾å¤±è´¥ï¼š' + song.name + ' â€” ' + e.message + '</span>';
            });
        }
        updateUI();
    }

        function updateUI() {
            document.querySelectorAll('.song-item').forEach(function(el, i) {
                if (i === currentIndex) {
                    el.classList.add('playing');
                } else {
                    el.classList.remove('playing');
                }
            });
            btnPlay.textContent = audio.paused ? 'â–¶ æ’­æ”¾' : 'â¸ æš‚åœ';
        }

        function togglePlay() {
            if (currentIndex === -1) { playIndex(0); return; }
            if (audio.paused) audio.play(); else audio.pause();
            updateUI();
        }

        function next() { playIndex((currentIndex + 1) % songs.length); }
        function prev() { playIndex((currentIndex - 1 + songs.length) % songs.length); }

        audio.addEventListener('play', updateUI);
        audio.addEventListener('pause', updateUI);
        audio.addEventListener('error', function() {
            status.innerHTML = 'âŒ <span class="error">éŸ³é¢‘åŠ è½½å¤±è´¥ï¼Œè¯·æ£€æŸ¥éŸ³ä¹æ–‡ä»¶æ˜¯å¦å¯è®¿é—®</span>';
        });

        init();
    </script>
